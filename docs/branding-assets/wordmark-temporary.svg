      .text-main { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 32px; fill: #0F172A; }
      .text-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 400; font-size: 32px; fill: #64748B; }
